<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse 70% 45% at 100% 0%, rgba(255, 209, 102, 0.35) 0%, transparent 50%),
      linear-gradient(195deg, #FFFCF9 0%, #FFD8C4 38%, #C44A1F 100%);
    position: relative;
  }
  .device-area {
    position: absolute;
    top: -2%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 1;
  }
  .device-area img {
    width: 78vw;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 2vw 3.5vw rgba(42, 33, 28, 0.3));
  }
  .text-area {
    position: absolute;
    bottom: 6%;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 8%;
    z-index: 2;
  }
  h1 {
    font-size: 11.5vw;
    font-weight: 800;
    color: #FFFCF9;
    line-height: 1.02;
    margin-bottom: 1.6vh;
    letter-spacing: -0.03em;
    text-shadow: 0 0.35vw 0 rgba(42, 33, 28, 0.25);
  }
  p {
    font-size: 4.8vw;
    font-weight: 600;
    color: rgba(255, 252, 249, 0.9);
    line-height: 1.25;
    max-width: 90%;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="device-area">
    <img data-kou-id="device" data-kou-role="device" src="{{app_screenshot}}" alt="">
  </div>
  <div class="text-area">
    <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
    <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
  </div>
</body>
</html>
