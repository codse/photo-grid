<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(255, 107, 53, 0.35) 0%, transparent 55%),
      linear-gradient(145deg, #2A211C 0%, #5C3A2A 48%, #FF6B35 100%);
    position: relative;
  }
  .text-area {
    position: absolute;
    top: 5.5%;
    left: 0;
    right: 0;
    text-align: left;
    padding: 0 8%;
    z-index: 2;
  }
  h1 {
    font-size: 11.8vw;
    font-weight: 800;
    color: #FFD166;
    line-height: 1.02;
    margin-bottom: 1.8vh;
    letter-spacing: -0.03em;
  }
  p {
    font-size: 4.8vw;
    font-weight: 600;
    color: rgba(255, 252, 249, 0.88);
    line-height: 1.25;
    max-width: 92%;
  }
  .device-area {
    position: absolute;
    bottom: -12%;
    right: -18%;
    z-index: 1;
    transform: rotate(-8deg);
  }
  .device-area img {
    width: 88vw;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 3vw 5vw rgba(0, 0, 0, 0.4));
  }
</style>
</head>
<body>
  <div class="text-area">
    <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
    <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
  </div>
  <div class="device-area">
    <img data-kou-id="device" data-kou-role="device" src="{{app_screenshot}}" alt="">
  </div>
</body>
</html>
