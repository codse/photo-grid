<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse 80% 50% at 50% 110%, rgba(255, 209, 102, 0.4) 0%, transparent 55%),
      linear-gradient(175deg, #FFE8DC 0%, #FFFCF9 55%, #EDE4DC 100%);
    position: relative;
  }
  .cluster {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6% 6% 4%;
    gap: 3vh;
  }
  .text-area {
    text-align: center;
    z-index: 2;
  }
  h1 {
    font-size: 11vw;
    font-weight: 800;
    color: #2A211C;
    line-height: 1.02;
    margin-bottom: 1.5vh;
    letter-spacing: -0.03em;
  }
  p {
    font-size: 4.6vw;
    font-weight: 600;
    color: rgba(42, 33, 28, 0.7);
    line-height: 1.25;
    max-width: 90%;
    margin: 0 auto;
  }
  .device-area {
    z-index: 1;
    display: flex;
    justify-content: center;
  }
  .device-area img {
    width: 72vw;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 2vw 3.5vw rgba(42, 33, 28, 0.22));
  }
</style>
</head>
<body>
  <div class="cluster">
    <div class="text-area">
      <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
      <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
    </div>
    <div class="device-area">
      <img data-kou-id="device" data-kou-role="device" src="{{app_screenshot}}" alt="">
    </div>
  </div>
</body>
</html>
